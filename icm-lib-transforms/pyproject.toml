[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "icm-lib-transforms"
version = "0.1.0"
description = "Transform expressions for interoperability: a function library, a pattern grammar and compiled pipelines."
authors = [{name = "David Raker", email = "david.raker@pnnl.gov"}]
license = "Apache-2.0"
license-files = ["LICENSE", "COPYRIGHT.md"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["interoperability", "transform", "mapping"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
]
dependencies = [
    "convtools>=1.14.7",
    "pyparsing>=3.2.5",
]

[project.urls]
Repository = "https://github.com/interoperability-control-modules/icm-utils"
Homepage = "https://github.com/interoperability-control-modules/icm-utils"

[tool.poetry]
packages = [{ include = "icm", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
