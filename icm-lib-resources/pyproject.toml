[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "icm-lib-resources"
version = "0.1.0"
description = "Resource models, resource clients and wire codecs for interoperability agents."
authors = ["David Raker <david.raker@pnnl.gov>"]
license = "Apache License 2.0"
readme = "README.md"
repository = "https://github.com/interoperability-control-modules/icm-utils"
homepage = "https://github.com/interoperability-control-modules/icm-utils"
keywords = ["interoperability", "resource", "openfmb"]
packages = [{ include = "icm", from = "src" }]
include = [{ path = "src/icm/resources/openfmb/descriptors/*", format = ["sdist", "wheel"] }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
icm-lib-transforms = ">=0.1.0"
pydantic = ">=2.11"
# Protobuf encoding of OpenFMB profiles (icm.resources.codecs.openfmb) needs the protobuf runtime.
protobuf = { version = ">=6.31.1", optional = true }
# ResourceData and ResourceWriter are VOLTTRON clients: they speak VIP pubsub and RPC.
volttron-core = { version = ">=2.0.0rc30", optional = true }

[tool.poetry.extras]
openfmb = ["protobuf"]
volttron = ["volttron-core"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
