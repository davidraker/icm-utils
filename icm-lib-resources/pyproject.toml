[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "icm-lib-resources"
version = "0.1.0"
description = "Resource models, resource clients and wire codecs for interoperability agents."
authors = [{name = "David Raker", email = "david.raker@pnnl.gov"}]
license = "Apache-2.0"
license-files = ["LICENSE", "COPYRIGHT.md"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["interoperability", "resource", "openfmb"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
]
dependencies = [
    "icm-lib-transforms>=0.1.0",
    "pydantic>=2.11",
]

[project.optional-dependencies]
openfmb = ["protobuf>=6.31.1"]
volttron = ["volttron-core>=2.0.0rc30"]

[project.urls]
Repository = "https://github.com/interoperability-control-modules/icm-utils"
Homepage = "https://github.com/interoperability-control-modules/icm-utils"

[tool.poetry]
packages = [{ include = "icm", from = "src" }]
include = [{ path = "src/icm/resources/openfmb/descriptors/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
